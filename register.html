<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect | Registration</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f3f6fc;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
      color: #1e293b;
    }

    .register-container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 35px rgba(0,0,0,0.08);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      color: #2563eb;
      font-size: 29px;
      margin-bottom: 8px;
    }

    .brand p {
      color: #64748b;
      font-size: 14px;
    }

    .form-title {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 17px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #dbe2ea;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
      background: white;
    }

    input:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.10);
    }

    .password-help {
      color: #64748b;
      font-size: 12px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .role-section {
      margin-top: 8px;
      padding: 20px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
    }

    .role-section h3 {
      font-size: 17px;
      margin-bottom: 18px;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 22px;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }

    .login-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }

    @media(max-width:550px) {
      .register-container {
        padding: 23px 18px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<div class="register-container">

  <div class="brand">
    <h1>CampusConnect</h1>
    <p>Student Complaint Management System</p>
  </div>

  <h2 class="form-title">Create Your Account</h2>

  <form id="registerForm">

    <div class="form-group">
      <label for="name">Full Name</label>
      <input type="text" id="name"
        placeholder="Enter your full name" required>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email"
          placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile"
          placeholder="10-digit mobile number"
          pattern="[0-9]{10}" maxlength="10" required>
      </div>

    </div>

    <div class="form-grid">

      <div class="form-group">
        <label for="password">Create Password</label>
        <input type="password" id="password"
          placeholder="Create a password"
          minlength="8" maxlength="128" required>

        <p class="password-help">
          Minimum 8 characters, including uppercase, lowercase
          and at least one number.
        </p>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
          placeholder="Re-enter your password"
          minlength="8" maxlength="128" required>
      </div>

    </div>

    <div class="role-section">

      <h3>Student Details</h3>

      <div class="form-group">
        <label for="studentId">Student ID / Roll Number</label>
        <input type="text" id="studentId"
          placeholder="Enter your roll number" required>
      </div>

      <div class="form-grid">

        <div class="form-group">
          <label for="course">Course</label>
          <select id="course" required>
            <option value="">Select Course</option>
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="MBA">MBA</option>
            <option value="BBA">BBA</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="semester">Semester</label>
          <select id="semester" required>
            <option value="">Select Semester</option>
            <option value="1st Semester">1st Semester</option>
            <option value="2nd Semester">2nd Semester</option>
            <option value="3rd Semester">3rd Semester</option>
            <option value="4th Semester">4th Semester</option>
            <option value="5th Semester">5th Semester</option>
            <option value="6th Semester">6th Semester</option>
            <option value="7th Semester">7th Semester</option>
            <option value="8th Semester">8th Semester</option>
          </select>
        </div>

      </div>

      <div class="form-group">
        <label for="studentDepartment">Department</label>
        <select id="studentDepartment" required>
          <option value="">Select Department</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Electronics">Electronics</option>
          <option value="Mechanical">Mechanical</option>
          <option value="Civil">Civil</option>
          <option value="Management">Management</option>
          <option value="Other">Other</option>
        </select>
      </div>

    </div>

    <button type="submit" class="submit-btn" id="registerBtn">
      Register Now
    </button>

    <p id="message" role="status" aria-live="polite"></p>

  </form>

  <div class="login-link">
    Already registered?
    <a href="login.html">Login Here</a>
  </div>

</div>

<script>

const API_URL =
  "https://t7jsqlniysev7enb3elizqhe7a0hjezy.lambda-url.us-east-1.on.aws/";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const registerBtn = document.getElementById("registerBtn");

form.addEventListener("submit", async function(event) {

  event.preventDefault();

  const password = document.getElementById("password").value;
  const confirmPassword =
    document.getElementById("confirmPassword").value;

  if (password.length < 8 || password.length > 128) {
    message.style.color = "#dc2626";
    message.textContent =
      "Password must contain between 8 and 128 characters.";
    return;
  }

  const passwordPattern =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{8,128}$/;

  if (!passwordPattern.test(password)) {
    message.style.color = "#dc2626";
    message.textContent =
      "Password must contain uppercase, lowercase and at least one number.";
    return;
  }

  if (password !== confirmPassword) {
    message.style.color = "#dc2626";
    message.textContent =
      "Password and Confirm Password do not match.";
    return;
  }

  const userData = {
    full_name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim().toLowerCase(),
    mobile: document.getElementById("mobile").value.trim(),
    role: "student",
    password: password,
    roll_number: document.getElementById("studentId").value.trim(),
    course: document.getElementById("course").value,
    semester: document.getElementById("semester").value,
    department: document.getElementById("studentDepartment").value
  };

  message.style.color = "#b45309";
  message.textContent = "Submitting your registration...";

  registerBtn.disabled = true;
  registerBtn.textContent = "Please wait...";

  try {

    const apiResponse = await fetch(API_URL + "register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(userData)
    });

    const result = await apiResponse.json();

    if (!apiResponse.ok) {
      throw new Error(
        result.message || result.error ||
        "Registration failed. Please try again."
      );
    }

    message.style.color = "#15803d";
    message.textContent =
      "Registration successful! Your student account is active. Please login to continue.";

    form.reset();

  } catch (error) {

    console.error("Registration error:", error);

    message.style.color = "#dc2626";

    if (error instanceof TypeError) {
      message.textContent =
        "Unable to connect to the server. Please check your internet connection or API CORS settings.";
    } else {
      message.textContent = error.message;
    }

  } finally {

    registerBtn.disabled = false;
    registerBtn.textContent = "Register Now";

  }

});

</script>

</body>
</html>
