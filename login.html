<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusConnect | Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #172033;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 40px 35px;
      border-radius: 18px;
      box-shadow: 0 12px 45px rgba(20, 35, 65, 0.08);
      border: 1px solid #e9edf4;
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      background: #eaf1ff;
      color: #2563eb;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: 800;
      margin: 0 auto 15px;
    }

    .brand h1 {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .brand h1 span {
      color: #2563eb;
    }

    .brand p {
      color: #7b8496;
      font-size: 13px;
      margin-top: 8px;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading h2 {
      font-size: 21px;
      margin-bottom: 7px;
    }

    .heading p {
      font-size: 13px;
      color: #7b8496;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #dce2eb;
      border-radius: 9px;
      font-size: 14px;
      outline: none;
      background: #ffffff;
      color: #172033;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: #2563eb;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .login-btn:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      color: #7b8496;
      font-size: 13px;
    }

    a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      color: #a0a7b4;
      font-size: 11px;
      margin-top: 28px;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 32px 23px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="brand">
      <div class="brand-icon">C</div>
      <h1>Campus<span>Connect</span></h1>
      <p>Student Complaint Management System</p>
    </div>

    <div class="heading">
      <h2>Welcome Back</h2>
      <p>Sign in using your registered email address.</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your registered email"
          autocomplete="username"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="toggle-password"
            id="togglePassword"
          >
            Show
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        Sign In
      </button>

      <div class="message" id="message" role="status" aria-live="polite"></div>

    </form>

    <div class="register-link">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="footer">
      © 2026 CampusConnect. All rights reserved.
    </div>

  </div>

  <script>

    // =====================================
    // AWS LAMBDA API CONFIGURATION
    // =====================================

    const API_BASE =
      "https://t7jsqlniysev7enb3elizqhe7a0hjezy.lambda-url.us-east-1.on.aws";


    // =====================================
    // SHOW / HIDE PASSWORD
    // =====================================

    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", function () {

      const isHidden = passwordInput.type === "password";

      passwordInput.type = isHidden ? "text" : "password";

      togglePassword.textContent = isHidden ? "Hide" : "Show";

    });


    // =====================================
    // LOGIN MESSAGE
    // =====================================

    const loginForm = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");

    function showMessage(text, type) {

      message.style.display = "block";
      message.textContent = text;

      if (type === "success") {
        message.style.background = "#eafaf0";
        message.style.color = "#18743b";
      }

      else if (type === "error") {
        message.style.background = "#fff0f0";
        message.style.color = "#c62828";
      }

      else {
        message.style.background = "#fff7e6";
        message.style.color = "#946200";
      }
    }


    // =====================================
    // LOGIN API INTEGRATION
    // =====================================

    loginForm.addEventListener("submit", async function (event) {

      event.preventDefault();

      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = passwordInput.value;

      if (!email || !password) {
        showMessage("Please enter your email and password.", "error");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing In...";

      message.style.display = "none";

      try {

        const apiResponse = await fetch(`${API_BASE}/login`, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            email: email,
            password: password
          })

        });

        const result = await apiResponse.json();

        if (!apiResponse.ok) {

          if (apiResponse.status === 401) {
            throw new Error("Invalid email or password.");
          }

          if (apiResponse.status === 403) {
            throw new Error("Your account is pending admin approval.");
          }

          throw new Error(
            result.error || "Login failed. Please try again."
          );

        }

        if (!result.token || !result.user) {
          throw new Error("Invalid login response from server.");
        }

        // Store login information for this browser session.
        sessionStorage.setItem("campusToken", result.token);

        sessionStorage.setItem(
          "campusUser",
          JSON.stringify(result.user)
        );

        sessionStorage.setItem(
          "campusTokenExpiry",
          String(Date.now() + (result.expires_in * 1000))
        );

        showMessage(
          "Login successful! Redirecting to CampusConnect...",
          "success"
        );

        loginBtn.textContent = "Login Successful";

        // Current destination: main project page.
        // Role-specific dashboard routing can be added later.
        setTimeout(function () {
          window.location.href = "index.html";
        }, 1000);

      }

      catch (error) {

        console.error("Login error:", error);

        showMessage(
          error.message || "Unable to connect to the server. Please try again.",
          "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Sign In";

      }

    });

  </script>

</body>
</html>
